<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ing-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#0E131F" />
    </linearGradient>

    <pattern id="ing-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .step-pulse {
        animation: step-light 3s ease-in-out infinite;
      }
      .flow-arrow {
        stroke-dasharray: 6 4;
        animation: flow-dash 15s linear infinite;
      }
      @keyframes flow-dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes step-light {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="640" rx="14" fill="url(#ing-bg)" />
  <rect width="1000" height="640" rx="14" fill="url(#ing-grid)" />
  <rect x="1" y="1" width="998" height="638" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="16" height="16" rx="4" fill="#22D3EE" />
    <text x="26" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">INGESTION &amp; RECOVERY LIFECYCLE</text>
    <text x="320" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">WebSocket Frame Ingestion, Self-Healing Sequence Checks &amp; Engine Bridge</text>
  </g>

  <!-- Connective Flow Lines -->
  <!-- Main vertical pipeline -->
  <path d="M 190 150 L 190 200" stroke="#8B5CF6" stroke-width="2" class="flow-arrow" />
  <path d="M 190 270 L 190 320" stroke="#8B5CF6" stroke-width="2" class="flow-arrow" />
  <path d="M 190 390 L 190 440" stroke="#22D3EE" stroke-width="2" class="flow-arrow" />
  <path d="M 190 510 L 190 560" stroke="#10B981" stroke-width="2" class="flow-arrow" />

  <!-- Branch to Sequence Gap Recovery -->
  <path d="M 290 355 L 430 355" stroke="#F43F5E" stroke-width="2" class="flow-arrow" />
  <path d="M 610 355 L 700 355 L 700 120 L 290 120" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- STEP 1: Incoming WebSocket Frame -->
  <g transform="translate(40, 90)">
    <rect width="250" height="62" rx="8" fill="#131B2E" stroke="#8B5CF6" stroke-width="1.2" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">1. WEBSOCKET FRAME</text>
    <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">Polymarket / Kalshi feed</text>
    <circle cx="230" cy="22" r="4" fill="#8B5CF6" />
  </g>

  <!-- STEP 2: Watchdog & SHA-256 Deduplication -->
  <g transform="translate(40, 200)">
    <rect width="250" height="70" rx="8" fill="#131B2E" stroke="#8B5CF6" stroke-width="1.2" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">2. DEDUP &amp; WATCHDOG</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#94A3B8">SHA-256 Digest (10k rolling deque)</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748B">30s Silence timeout watchdog</text>
  </g>

  <!-- STEP 3: Sequence & Gap Check -->
  <g transform="translate(40, 320)">
    <rect width="250" height="72" rx="8" fill="#131B2E" stroke="#22D3EE" stroke-width="1.5" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">3. SEQUENCE EVALUATION</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#10B981">seq == prev + 1 : Apply Delta</text>
    <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#F43F5E">seq &gt; prev + 1 : Sequence Gap!</text>
  </g>

  <!-- GAP RECOVERY MODULE (Right branch) -->
  <g transform="translate(430, 316)">
    <rect width="180" height="78" rx="8" fill="#1F1322" stroke="#F43F5E" stroke-width="1.2" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F43F5E">GAP DETECTED</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">1. Increment counters</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">2. Tear down feed socket</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#38BDF8">3. Reconnect &amp; Resubscribe</text>
  </g>

  <!-- STEP 4: Integer Tick Normalization -->
  <g transform="translate(40, 440)">
    <rect width="250" height="70" rx="8" fill="#131B2E" stroke="#22D3EE" stroke-width="1.2" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">4. NORMALIZATION</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0">Price * 10,000 (0..10000 ticks)</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Binary NO contract: ask = 10000 - p</text>
  </g>

  <!-- STEP 5: C++ Engine Dispatch & Broadcast -->
  <g transform="translate(40, 560)">
    <rect width="250" height="62" rx="8" fill="#131B2E" stroke="#10B981" stroke-width="1.2" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34D399">5. ENGINE UPDATE &amp; FANOUT</text>
    <text x="16" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">pp_set_level() / pp_snapshot()</text>
  </g>

  <!-- SIDEBAR DETAIL: DUAL ENGINE PERSISTENCE -->
  <g transform="translate(370, 450)">
    <!-- Branch from Step 5 -->
    <path d="M 290 590 L 370 590" stroke="#10B981" stroke-width="2" class="flow-arrow" />
    <rect width="360" height="150" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">DUAL DISPATCH TARGETS</text>

    <!-- Target A: SQLite WAL Journal -->
    <g transform="translate(18, 42)">
      <rect width="155" height="92" rx="6" fill="#131B2E" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8">SQLite WAL Journal</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Local event log</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Replay buffer</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">ClickHouse retry source</text>
    </g>

    <!-- Target B: Async WebSockets -->
    <g transform="translate(186, 42)">
      <rect width="155" height="92" rx="6" fill="#131B2E" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A78BFA">WebSocket Clients</text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Backpressure queue (100)</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Non-blocking put_nowait</text>
      <text x="10" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#94A3B8">Web Worker stream parser</text>
    </g>
  </g>

  <!-- KEY INVARIANTS CALLOUT -->
  <g transform="translate(430, 90)">
    <rect width="520" height="190" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <rect width="520" height="30" rx="10" fill="#131F37" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">INGESTION SAFETY INVARIANTS</text>

    <text x="18" y="54" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A78BFA">1. Stale Snapshots Discarded:</text>
    <text x="36" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">If incoming snapshot seq &lt; current engine seq, snapshot is rejected.</text>

    <text x="18" y="98" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A78BFA">2. Incremental Deltas require Prior Snapshot:</text>
    <text x="36" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Updates received before an initial snapshot raise ValueError.</text>

    <text x="18" y="142" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A78BFA">3. Zero Quantity Clears Level:</text>
    <text x="36" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Setting quantity = 0 triggers O(1) or O(N) erasure in sorted array.</text>
  </g>
</svg>
