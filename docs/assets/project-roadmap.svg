      <rect width="4" height="96" rx="2" fill="#475569" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">PHASE 9: PRODUCTION HARDENING</text>
      <rect x="390" y="12" width="84" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="0.8" />
