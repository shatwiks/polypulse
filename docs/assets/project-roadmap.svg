      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">PHASE 8: DISTRIBUTED SYSTEMS RELIABILITY</text>
