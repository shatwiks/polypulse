      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">PHASE 1: MVP FOUNDATION</text>
      <rect x="390" y="12" width="84" height="20" rx="4" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
      <text x="404" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#6EE7B7">COMPLETED</text>
      <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">FastAPI async server, initial Docker compose, base schemas.</text>
      <text x="18" y="66" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">backend/main.py · docker-compose.yml · requirements.txt</text>
