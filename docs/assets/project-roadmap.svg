<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#0B0F1A" />
    </linearGradient>

    <pattern id="rm-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .phase-pulse {
        animation: ppulse 2.5s ease-in-out infinite;
      }
      .track-line {
        stroke-dasharray: 6 4;
        animation: track-dash 20s linear infinite;
      }
      @keyframes ppulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes track-dash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <rect width="1100" height="680" rx="14" fill="url(#rm-bg)" />
  <rect width="1100" height="680" rx="14" fill="url(#rm-grid)" />
  <rect x="1" y="1" width="1098" height="678" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="16" height="16" rx="4" fill="#8B5CF6" />
    <text x="26" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">ENGINEERING ROADMAP &amp; MILESTONES</text>
    <text x="360" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Development Phases Grounded in Actual Codebase Implementation</text>
  </g>

