    <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Completed (7)</text>

    <circle cx="120" cy="7" r="4" fill="#22D3EE" />
    <text x="130" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">In Progress (1)</text>

    <circle cx="230" cy="7" r="4" fill="#64748B" />
    <text x="240" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Planned (2)</text>
  </g>

  <!-- COLUMN 1: PHASES 1 to 5 (Left) -->
  <g transform="translate(40, 75)">
