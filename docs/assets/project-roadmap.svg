      <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Polymarket WS feed, Kalshi RSA-authenticated v2 feed, demo simulator.</text>
      <text x="18" y="66" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">backend/connectors.py · backend/normalizers.py</text>
