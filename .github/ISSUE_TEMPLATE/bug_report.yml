name: Bug Report
description: Report a reproducible problem, crash, or unexpected behavior in PolyPulse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have checked the [Documentation](docs/) and verified that the problem is reproducible.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which sub-system is failing?
      placeholder: "e.g., C++ engine, Polymarket connector, Kalshi auth, ClickHouse export, React terminal"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Set POLYPULSE_MODE=...
        2. Execute command '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Stack Traces
      description: Paste terminal output, error logs, or compiler errors.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Operating System & Compiler
      description: OS version, C++ compiler version (`g++ --version`), Python version (`python --version`), and Node version.
      placeholder: "e.g., Ubuntu 24.04, GCC 13.2, Python 3.11, Node 20"
    validations:
      required: true
