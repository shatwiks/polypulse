name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. C++ Engine Build, Tests & Microbenchmarks
  # ============================================================================
  cpp-engine:
    name: C++20 Engine (Ubuntu & Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and Test C++ Engine (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p engine/build
          g++ -std=c++20 -O2 -I engine/include engine/src/orderbook.cpp engine/tests/orderbook_test.cpp -o engine/build/orderbook_test
          ./engine/build/orderbook_test
          echo "C++ unit tests passed!"

      - name: Compile and Test C++ Engine (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "engine/build" -Force | Out-Null
          g++ -std=c++20 -O2 -I engine/include engine/src/orderbook.cpp engine/tests/orderbook_test.cpp -o engine/build/orderbook_test.exe
          .\engine\build\orderbook_test.exe
          Write-Host "C++ unit tests passed on Windows!"

      - name: Execute Microbenchmarks
        run: |
          python scripts/benchmark.py

  # ============================================================================
  # 2. Python Pipeline & Normalization Tests
  # ============================================================================
  python-pipeline:
    name: Python Pipeline & Ingestion Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build C++ Shared Library
        run: |
          python scripts/build_engine.py

      - name: Run Python Unit & Pipeline Tests
        run: |
          python -m unittest discover -s tests -v

  # ============================================================================
  # 3. Frontend TypeScript & Production Build
  # ============================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & Vite build
        run: npm run build
